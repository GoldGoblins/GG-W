[package]
name = "engine-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 auth (SRP6) + world wire protocol and the engine-auth CLI"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
engine-srp = { path = "../engine-srp" }
flate2 = "1.0"
sha1.workspace = true
# Derives `SessionEventKind`, `SessionEvent`'s fieldless twin that the handler table keys on.
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
# The SRP probe example re-derives the handshake by hand, to vary what `engine-srp` fixes.
num-bigint = "0.4.6"
rand = "0.8.6"
