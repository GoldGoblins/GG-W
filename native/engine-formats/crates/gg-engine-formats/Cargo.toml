[package]
name = "gg-engine-formats"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde_json = "1"
anyhow = "1"
engine-blp = { path = "../engine-blp" }
engine-m2 = { path = "../engine-m2" }
engine-wmo = { path = "../engine-wmo" }
engine-adt = { path = "../engine-adt" }
engine-wdt = { path = "../engine-wdt" }
engine-dbc = { path = "../engine-dbc" }
engine-mpq = { path = "../engine-mpq" }
engine-formats-core = { path = "../engine-formats-core", default-features = false }
engine-bytes = { path = "../engine-bytes" }
glam = "0.31"
